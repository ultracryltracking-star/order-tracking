<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pledge Tracking Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .header-logo {
            max-width: 200px;
            height: auto;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .dashboard {
            padding: 30px;
        }
        
        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            border-left: 5px solid #4facfe;
        }
        
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #666;
            font-size: 1.1em;
        }
        
        .search-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .search-section h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .search-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .search-btn {
            padding: 12px 25px;
            background: #4facfe;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        
        .search-btn:hover {
            background: #357abd;
        }
        
        .result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
        }
        
        .result.shipped {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .result.pending {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        
        .result.not-found {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .heatmap-section h3 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .heatmap {
            display: grid;
            grid-template-columns: repeat(50, 1fr);
            gap: 2px;
            margin-bottom: 20px;
            max-width: 100%;
            overflow-x: auto;
        }
        
        .order-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
            font-size: 0;
            cursor: pointer;
            transition: transform 0.2s, z-index 0.2s;
            position: relative;
        }
        
        .order-cell:hover {
            transform: scale(2);
            z-index: 10;
            border: 2px solid #333;
        }
        
        .order-cell.shipped {
            background: #6fa8dc;
        }
        
        .order-cell.pending {
            background: #e06666;
        }
        
        .order-cell:hover::after {
            content: attr(data-order);
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            margin-top: 4px;
            z-index: 20;
        }
        
        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 15px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="https://www.ten01.org/web/image/website/1/logo/ten01?unique=0175abc" alt="ten01 Logo" class="header-logo">
            <h1>📦 Pledge Tracking Dashboard</h1>
            <p>Track your Pledge</p>
        </div>
        
        <div class="dashboard">
            <div class="stats-section">
                <div class="stat-card">
                    <div class="stat-number" id="totalOrders">0</div>
                    <div class="stat-label">Total Pledges</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="shippedOrders">0</div>
                    <div class="stat-label">Pledges Shipped</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="pendingOrders">0</div>
                    <div class="stat-label">Pending Pledges</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="lastShipped">None</div>
                    <div class="stat-label">Last Pledge Shipped</div>
                </div>
            </div>
            
            <div class="search-section">
                <h3>🔍 Check Your Pledge Status</h3>
                <div class="search-form">
                    <input type="text" class="search-input" id="orderInput" placeholder="Enter your Pledge number (e.g., 1, 754)">
                    <button class="search-btn" onclick="searchOrder()">Check Status</button>
                </div>
                <div id="searchResult"></div>
            </div>
            
            <div class="heatmap-section">
                <h3>📊 Kickstarter Delivery Status</h3>
                <div class="heatmap" id="heatmap"></div>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color shipped" style="background: #6fa8dc;"></div>
                        <span>Shipped</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color pending" style="background: #e06666;"></div>
                        <span>Not Shipped</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Replace this URL with your published Google Sheet URL
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRtw_KCwaCXXgeH7FhKFaoGts3Pt-nDuo8LD2YdhHJz1fMyZbcmtwD6RqjSs40xGlAs0AgkR5X7qJsZ/pub?output=csv';
        
        let ordersData = [];

        function loadDataFromGoogleSheet() {
            console.log('Loading data from:', SHEET_URL);
            fetch(SHEET_URL)
                .then(response => {
                    console.log('Response status:', response.status);
                    return response.text();
                })
                .then(data => {
                    console.log('Raw CSV data received:', data.substring(0, 200));
                    ordersData = parseCSV(data);
                    console.log('Total pledges loaded:', ordersData.length);
                    updateDashboard();
                })
                .catch(error => {
                    console.error('Error loading data:', error);
                    alert('Error loading pledge data. Please check the Google Sheet URL.');
                    updateDashboard();
                });
        }

        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            const data = [];
            
            // Skip header row (index 0)
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line) {
                    // Split by comma, handling potential quotes
                    const values = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
                    
                    const orderNum = values[0]?.replace(/"/g, '').trim();
                    const shippedVal = values[1]?.replace(/"/g, '').trim();
                    const dateVal = values[2]?.replace(/"/g, '').trim();
                    
                    if (orderNum) {
                        data.push({
                            orderNumber: orderNum,
                            shipped: parseInt(shippedVal) || 0,
                            dateShipped: dateVal || ''
                        });
                    }
                }
            }
            console.log('Parsed data:', data.length, 'pledges');
            return data;
        }

        function updateDashboard() {
            updateStats();
            updateHeatmap();
        }

        function updateStats() {
            const total = ordersData.length;
            const shipped = ordersData.filter(order => order.shipped === 1).length;
            const pending = total - shipped;
            
            // Find last shipped order by date, then by order number
            const shippedOrders = ordersData
                .filter(order => order.shipped === 1 && order.dateShipped)
                .sort((a, b) => {
                    // First sort by date (LATEST date first)
                    const dateA = new Date(a.dateShipped);
                    const dateB = new Date(b.dateShipped);
                    const dateCompare = dateB - dateA; // Latest date first
                    if (dateCompare !== 0) return dateCompare;
                    
                    // If dates are equal, sort by order number (highest first)
                    const aNum = parseInt(a.orderNumber.replace(/\D/g, '')) || 0;
                    const bNum = parseInt(b.orderNumber.replace(/\D/g, '')) || 0;
                    return bNum - aNum;
                });
            
            const lastShipped = shippedOrders.length > 0 ? shippedOrders[0].orderNumber : 'None';

            document.getElementById('totalOrders').textContent = total;
            document.getElementById('shippedOrders').textContent = shipped;
            document.getElementById('pendingOrders').textContent = pending;
            document.getElementById('lastShipped').textContent = lastShipped;
        }

        function updateHeatmap() {
            const heatmap = document.getElementById('heatmap');
            heatmap.innerHTML = '';

            ordersData.forEach(order => {
                const cell = document.createElement('div');
                cell.className = `order-cell ${order.shipped === 1 ? 'shipped' : 'pending'}`;
                cell.setAttribute('data-order', order.orderNumber);
                cell.title = `${order.orderNumber} - ${order.shipped === 1 ? 'Shipped' : 'Pending'}`;
                cell.onclick = () => showOrderDetails(order);
                heatmap.appendChild(cell);
            });
        }

        function searchOrder() {
            const orderNumber = document.getElementById('orderInput').value.trim().toUpperCase();
            const resultDiv = document.getElementById('searchResult');
            
            if (!orderNumber) {
                resultDiv.innerHTML = '<div class="result not-found">Please enter a Pledge number</div>';
                return;
            }

            const order = ordersData.find(o => o.orderNumber.toUpperCase() === orderNumber);
            
            if (!order) {
                resultDiv.innerHTML = '<div class="result not-found">❌ Pledge not found</div>';
                return;
            }

            if (order.shipped === 1) {
                resultDiv.innerHTML = `<div class="result shipped">✅ Pledge ${order.orderNumber} has been shipped on or before: ${order.dateShipped}</div>`;
            } else {
                resultDiv.innerHTML = `<div class="result pending">📦 Pledge ${order.orderNumber} has not yet shipped.</div>`;
            }
        }

        function showOrderDetails(order) {
            const status = order.shipped === 1 ? 'Shipped on/before' : 'Pending';
            const date = order.dateShipped ? ` ${order.dateShipped}` : '';
            alert(`Pledge: ${order.orderNumber}\nStatus: ${status}${date}`);
        }

        // Allow Enter key to search
        document.getElementById('orderInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchOrder();
            }
        });

        // Initialize dashboard
        loadDataFromGoogleSheet();
    </script>
</body>
</html>
